<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나의 복제인간은 누구인가?</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Noto Sans KR", "Malgun Gothic", sans-serif;
      background: linear-gradient(135deg, #f7f4ff, #eefaf7);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      color: #252525;
    }
    .card {
      width: min(760px, 100%);
      background: white;
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      text-align: center;
    }
    .title {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 10px;
    }
    .hint {
      display: inline;
      font-size: 18px;
      font-weight: 700;
      line-height: 1.8;
      background: linear-gradient(
        transparent 45%,
        #fff59d 45%,
        #fff59d 90%,
        transparent 90%
      );
      padding: 2px 5px;
      margin: 0 0 22px;
    }
    .photo {
      width: 100%;
      display: block;
      border-radius: 16px;
      border: 1px solid #eee;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="title">나의 복제인간은 누구인가?</div>
    <p class="hint">아래 사진 속 책을 찾으세.</p>
    <img class="photo" src="b02.jpg" alt="도서관 책상 사진">
  </main>
</body>
</html>
